<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quote Generator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="quote-card">
      <h1>Random Quote Generator</h1>
      <blockquote id="quoteText">Click the button to get inspired.</blockquote>
      <p id="quoteAuthor" class="author"></p>
      <div class="button-group">
        <button id="newQuoteBtn" type="button">Show Random Quote</button>
        <button id="themeToggleBtn" type="button" aria-pressed="false">
          Switch to Dark Mode
        </button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
